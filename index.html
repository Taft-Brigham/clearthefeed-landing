<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearTheFeed | Less noise. More you.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Inter:wght@400;600&family=Caveat:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo">Clear<span class="lime">The</span>Feed</div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1>Clear your feed.<br>Clear your mind.</h1>

            <div class="animation-container">
                <div id="dynamic-text" class="noise-word">DRAMA</div>
                <div class="doodle-arrow">↗</div>
            </div>

            <p class="subtitle">A better digital experience starts with what you choose to consume. <br><strong>Less
                    noise. More you.</strong></p>

            <form id="capture-form">
                <input type="email" id="email" placeholder="Enter your email to start clearing..." required>
                <button type="submit" class="lime-btn">START CLEARING →</button>
            </form>
            <p class="doodle-note">✦ Ditch the junk. Keep what matters.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
